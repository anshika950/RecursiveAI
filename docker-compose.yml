version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - MODEL_TYPE=ollama
      - MODEL_NAME=mistral
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite:///./app.db
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    depends_on:
      - ollama
    networks:
      - ai-network
    volumes:
      - ./app:/app/app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-network
    volumes:
      - ollama_data:/root/.ollama

networks:
  ai-network:
    driver: bridge

volumes:
  ollama_data:
