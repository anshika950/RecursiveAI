version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's localhost default -- inside the compose network,
      # Ollama is reachable at its service name, not localhost.
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - ai-network
    volumes:
      - ./app:/app/app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-network
    volumes:
      - ollama_data:/root/.ollama

networks:
  ai-network:
    driver: bridge

volumes:
  ollama_data:
